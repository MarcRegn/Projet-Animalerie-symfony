security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_MEMBER
            - ROLE_USER

        ROLE_MEMBER:
            - ROLE_USER

    firewalls:

        dev:
            pattern: ^/(_profiler|_wdt|css|images|js)/
            security: false

        main:
            lazy: true
            provider: user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true

            logout:
                path: logout
                target: homepage

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/create-animal, roles: ROLE_MEMBER }
